[project]
name = "apishift"
version = "0.1.0"
description = "Migrate Python code across breaking library upgrades (pandas 1.x → 2.x), verified by your test suite."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The core (scanner, codemods, verifier, PR opener) uses only the standard library.
dependencies = []

[project.optional-dependencies]
groq = ["groq>=1.0,<2"]
claude = ["anthropic>=1.15,<2"]
all = ["groq>=1.0,<2", "anthropic>=1.15,<2"]
dev = ["pytest>=8", "pandas>=2.2,<2.3", "groq>=1.0,<2", "anthropic>=1.15,<2", "httpx>=0.27"]

[project.scripts]
apishift = "apishift.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apishift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
